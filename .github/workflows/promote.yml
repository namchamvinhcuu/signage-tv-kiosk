# Makes an already published release the stable one (releases/latest), which kiosk-pull.sh mirrors to
# <server>/kiosk/stable/. Run by hand: Actions -> promote -> Run workflow -> tag vX.Y.Z.
name: promote

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to promote to stable (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-24.04
    # Not `release`: that environment holds the signing secrets and only accepts v* tag runs; promote needs none.
    environment: promote
    permissions:
      contents: write
    steps:
      - name: Promote
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "'$TAG' is not vX.Y.Z"; exit 1; }
          [[ "$(gh release view "$TAG" --json isDraft --jq .isDraft < /dev/null)" == false ]] ||
            { echo "release $TAG is missing or still a draft"; exit 1; }
          gh release edit "$TAG" --prerelease=false --latest < /dev/null
          gh release view "$TAG" --json tagName,isPrerelease,assets --jq '{tagName, isPrerelease, assets: [.assets[].name]}' < /dev/null
